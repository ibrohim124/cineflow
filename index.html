<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFlow</title>

<style>
body{
margin:0;
background:#111;
color:white;
font-family:Arial;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:black;
}

.logo{
color:red;
font-size:32px;
font-weight:bold;
}

.hero{
height:500px;
background:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop') center/cover;
display:flex;
align-items:center;
padding:50px;
}

.hero-content{
background:rgba(0,0,0,0.7);
padding:30px;
border-radius:10px;
}

.movies{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.movie{
background:#222;
border-radius:10px;
overflow:hidden;
}

.movie img{
width:100%;
height:350px;
object-fit:cover;
}

.movie-info{
padding:15px;
}

button{
background:red;
border:none;
padding:10px 20px;
color:white;
cursor:pointer;
border-radius:5px;
}

iframe{
width:100%;
height:500px;
border:none;
margin-top:30px;
}
</style>
</head>

<body>

<header>
<div class="logo">CineFlow</div>
<button>Войти</button>
</header>

<section class="hero">
<div class="hero-content">
<h1>Смотри фильмы онлайн</h1>
<p>Лучшие фильмы и трейлеры</p>
<button>Смотреть</button>
</div>
</section>

<h2 style="padding:20px;">Популярные фильмы</h2>

<section class="movies">

<div class="movie">
<img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1200&auto=format&fit=crop">
<div class="movie-info">
<h3>John Wick</h3>
<p>2023</p>
<button>Смотреть</button>
</div>
</div>

<div class="movie">
<img src="https://images.unsplash.com/photo-1531061650978-5b44c30f4f?q=80&w=1200&auto=format&fit=crop">
<div class="movie-info">
<h3>Avatar</h3>
<p>2022</p>
<button>Смотреть</button>
</div>
</div>

<div class="movie">
<img src="https://images.unsplash.com/photo-1513106580091-1d8240868cd6?q=80&w=1200&auto=format&fit=crop">
<div class="movie-info">
<h3>Batman</h3>
<p>2024</p>
<button>Смотреть</button>
</div>
</div>

</section>

<h2 style="padding:20px;">Трейлер</h2>

<div style="padding:20px;">
<iframe src="https://www.youtube.com/embed/qEVUtrk8_B4"></iframe>
</div>

</body>
</html>
