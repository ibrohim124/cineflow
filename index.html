<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFlow</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#111;
}

.logo{
color:red;
font-size:32px;
font-weight:bold;
}

.hero{
height:80vh;
background:url('https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=1600&auto=format&fit=crop') center/cover;
display:flex;
align-items:center;
padding:50px;
}

.overlay{
background:rgba(0,0,0,0.7);
padding:40px;
border-radius:20px;
max-width:600px;
}

button{
background:red;
border:none;
padding:15px 25px;
color:white;
font-size:18px;
border-radius:10px;
cursor:pointer;
}

.movies{
padding:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#111;
border-radius:20px;
overflow:hidden;
}

.card img{
width:100%;
height:350px;
object-fit:cover;
}

.card h3{
padding:15px;
}

footer{
text-align:center;
padding:30px;
color:gray;
}
</style>
</head>

<body>

<header>
<div class="logo">CineFlow</div>
<button>Войти</button>
</header>

<section class="hero">
<div class="overlay">
<h1>Смотри фильмы онлайн</h1>
<p>Лучшие фильмы и сериалы в одном месте.</p>
<button>▶ Смотреть</button>
</div>
</section>

<section class="movies">

<div class="card">
<img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop">
<h3>John Wick</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1200&auto=format&fit=crop">
<h3>Avatar</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1518929458119-e5bf444c30f4?q=80&w=1200&auto=format&fit=crop">
<h3>Fast X</h3>
</div>

</section>

<footer>
© 2026 CineFlow
</footer>

</body>
</html>
