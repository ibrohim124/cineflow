<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFlow</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
}

header {
  background: black;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: red;
  font-size: 40px;
  font-weight: bold;
}

button {
  background: red;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 6px;
  cursor: pointer;
}

.hero {
  background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
  padding: 100px 40px;
}

.hero-box {
  background: rgba(0,0,0,0.7);
  max-width: 500px;
  padding: 30px;
  border-radius: 12px;
}

.auth {
  padding: 30px;
}

.auth input {
  display: block;
  margin-bottom: 15px;
  width: 250px;
  padding: 12px;
  border-radius: 6px;
  border: none;
}

.movies {
  padding: 30px;
}

.movie-grid {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.movie {
  background: #1b1b1b;
  border-radius: 12px;
  overflow: hidden;
  width: 260px;
}

.movie img {
  width: 100%;
  height: 340px;
  object-fit: cover;
}

.movie-info {
  padding: 15px;
}

iframe {
  width: 100%;
  max-width: 700px;
  height: 400px;
  border: none;
  border-radius: 12px;
}

.comments {
  padding: 30px;
}

.comment-box {
  width: 100%;
  max-width: 500px;
  padding: 12px;
  border-radius: 6px;
  border: none;
  margin-bottom: 10px;
}

.comment {
  background: #1e1e1e;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
  max-width: 500px;
}
</style>
</head>

<body>

<header>
  <div class="logo">CineFlow</div>
  <button onclick="alert('Добро пожаловать!')">Войти</button>
</header>

<section class="hero">
  <div class="hero-box">
    <h1>Смотри фильмы и видео</h1>
    <p>Музыка, фильмы и ролики в одном месте</p>
    <button onclick="window.scrollTo(0,700)">Смотреть</button>
  </div>
</section>

<section class="auth">
  <h2>Регистрация</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">

  <button onclick="registerUser()">Регистрация</button>
  <button onclick="loginUser()">Войти</button>
</section>

<section class="movies">
  <h2>Популярные фильмы</h2>

  <div class="movie-grid">

    <div class="movie">
      <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1200&auto=format&fit=crop">
      <div class="movie-info">
        <h3>John Wick</h3>
        <p>2023</p>
        <button onclick="alert('Фильм скоро будет доступен')">Смотреть</button>
      </div>
    </div>

    <div class="movie">
      <img src="https://images.unsplash.com/photo-1531061650978-5b44c30f4f?q=80&w=1200&auto=format&fit=crop">
      <div class="movie-info">
        <h3>Avatar</h3>
        <p>2022</p>
        <button onclick="alert('Фильм скоро будет доступен')">Смотреть</button>
      </div>
    </div>

    <div class="movie">
      <img src="https://images.unsplash.com/photo-1513106580091-1d8240868cd6?q=80&w=1200&auto=format&fit=crop">
      <div class="movie-info">
        <h3>Batman</h3>
        <p>2024</p>
        <button onclick="alert('Фильм скоро будет доступен')">Смотреть</button>
      </div>
    </div>

  </div>
</section>

<section style="padding:30px;">
  <h2>Трейлер</h2>

  <iframe src="https://www.youtube.com/embed/qEVUtrk8_B4"></iframe>
</section>

<section class="comments">
  <h2>Комментарии</h2>

  <input id="commentInput" class="comment-box" placeholder="Напиши комментарий">
  <button onclick="addComment()">Отправить</button>

  <div id="comments"></div>
</section>

<script>
function addComment() {
  const input = document.getElementById('commentInput');
  const comments = document.getElementById('comments');

  if(input.value.trim() === '') return;

  const div = document.createElement('div');
  div.className = 'comment';
  div.innerText = input.value;

  comments.prepend(div);
  input.value = '';
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7Eonxuzuela1c1ks6ojgpkrtjssz5vs"
  authDomain: "cineflow-media.firebaseapp.com",
  databaseURL: "https://cineflow-media-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cineflow-media",
  storageBucket: "cineflow-media.firebasestorage.app",
  messagingSenderId: "108430946203",
  appId: "1:108430946203:web:243772a6839cec36d2bb3e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.registerUser = async function () {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    alert('Регистрация успешна!');
  } catch (error) {
    alert(error.message);
  }
};

window.loginUser = async function () {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    alert('Вход выполнен!');
  } catch (error) {
    alert(error.message);
  }
};
</script>

</body>
</html>
