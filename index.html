<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CineFlow</title>

<style>
body{
margin:0;
background:#111;
font-family:Arial;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:black;
}

.logo{
color:red;
font-size:32px;
font-weight:bold;
}

.hero{
height:500px;
background:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop') center/cover;
display:flex;
align-items:center;
padding:40px;
}

.hero-box{
background:rgba(0,0,0,0.7);
padding:30px;
border-radius:10px;
}

button{
background:red;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
margin-top:10px;
}

.movies{
display:flex;
gap:20px;
padding:20px;
flex-wrap:wrap;
}

.movie{
background:#222;
width:250px;
border-radius:10px;
overflow:hidden;
}

.movie img{
width:100%;
height:350px;
object-fit:cover;
}

.movie-info{
padding:15px;
}

.auth{
padding:20px;
}

input{
padding:10px;
margin:5px;
width:250px;
border:none;
border-radius:5px;
}

iframe{
width:100%;
max-width:700px;
height:400px;
border:none;
border-radius:10px;
}

.comment-box{
padding:20px;
}

textarea{
width:300px;
height:100px;
padding:10px;
border-radius:5px;
border:none;
}

.comments{
margin-top:20px;
}

.comment{
background:#222;
padding:10px;
margin-top:10px;
border-radius:5px;
}
</style>

</head>

<body>

<header>
<div class="logo">CineFlow</div>

<div>
<button onclick="loginUser()">Войти</button>
</div>
</header>

<section class="hero">
<div class="hero-box">
<h1>Смотри фильмы и видео</h1>
<p>Музыка, фильмы и ролики в одном месте</p>
<button>Смотреть</button>
</div>
</section>

<div class="auth">
<h2>Регистрация</h2>

<input id="email" type="email" placeholder="Email">
<br>

<input id="password" type="password" placeholder="Пароль">
<br>

<button onclick="registerUser()">Регистрация</button>
<button onclick="loginUser()">Войти</button>
</div>

<h2 style="padding:20px;">Популярные фильмы</h2>

<section class="movies">

<div class="movie">
<img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1200&auto=format&fit=crop">

<div class="movie-info">
<h3>John Wick</h3>
<p>2023</p>

<button>Смотреть</button>
</div>
</div>

<div class="movie">
<img src="https://images.unsplash.com/photo-1531061650978-5b44c30f4f?q=80&w=1200&auto=format&fit=crop">

<div class="movie-info">
<h3>Avatar</h3>
<p>2022</p>

<button>Смотреть</button>
</div>
</div>

<div class="movie">
<img src="https://images.unsplash.com/photo-1513106580091-1d8240868cd6?q=80&w=1200&auto=format&fit=crop">

<div class="movie-info">
<h3>Batman</h3>
<p>2024</p>

<button>Смотреть</button>
</div>
</div>

</section>

<h2 style="padding:20px;">Видео</h2>

<div style="padding:20px;">
<iframe src="https://www.youtube.com/embed/qEVUtrk8_B4"></iframe>
</div>

<div style="padding:20px;">
<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
</div>

<div class="comment-box">

<h2>Комментарии</h2>

<textarea id="commentInput" placeholder="Напиши комментарий"></textarea>

<br>

<button onclick="addComment()">Отправить</button>

<div class="comments" id="comments"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "aizasyb7eonxuzuela1c1ks6ojgpkrtjssz5vs",

authDomain: "cineflow-media.firebaseapp.com",

databaseURL: "https://cineflow-media-default-rtdb.europe-west1.firebasedatabase.app",

projectId: "cineflow-media",

storageBucket: "cineflow-media.firebasestorage.app",

messagingSenderId: "108430946203",

appId: "1:108430946203:web:243772a6839cec36d2bb3e"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.registerUser = async function () {

const email = document.getElementById("email").value;

const password = document.getElementById("password").value;

try {

await createUserWithEmailAndPassword(auth,email,password);

alert("Регистрация успешна");

} catch(error){

alert(error.message);

}

}

window.loginUser = async function () {

const email = document.getElementById("email").value;

const password = document.getElementById("password").value;

try {

await signInWithEmailAndPassword(auth,email,password);

alert("Вход выполнен");

} catch(error){

alert(error.message);

}

}

window.addComment = function(){

const input = document.getElementById("commentInput");

const comments = document.getElementById("comments");

const div = document.createElement("div");

div.className = "comment";

div.innerText = input.value;

comments.appendChild(div);

input.value = "";

}

</script>

</body>
</html>
